<div class="dashboard-layout">
  <!-- Barra lateral fija (Sidebar) -->
  <aside class="sidebar">
    <!-- Cabecera de usuario -->
    <div class="user-header">
      <div class="user-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88C7.55 15.8 9.68 15 12 15s4.45.8 6.14 2.12C16.43 19.18 14.03 20 12 20z"/>
        </svg>
      </div>
      <span class="greeting-text">¡Hola, {{ userName() }}!</span>
    </div>

    <hr class="sidebar-divider" />

    <!-- Menú de navegación -->
    <nav class="nav-menu" aria-label="Navegación principal">
      <a routerLink="/entries" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Entradas (Clipboard + cápsula) -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h6.1c-.07-.32-.1-.66-.1-1 0-2.76 2.24-5 5-5 1.13 0 2.16.39 3 1.03V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-5 5h10v2H7V8zm0 4h7v2H7v-2zm13.71 4.29l-2-2a1.003 1.003 0 00-1.42 0l-3 3a1.003 1.003 0 000 1.42l2 2c.39.39 1.02.39 1.41 0l3-3c.4-.39.4-1.03.01-1.42z"/>
          </svg>
        </span>
        <span class="nav-label">Entradas</span>
      </a>

      <a routerLink="/patients" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Pacientes -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 5v14c0 1.1.9 2 2 2h7.1c-.07-.32-.1-.66-.1-1 0-1.64.81-3.09 2.03-4H6v-2h10.26c.54-.34 1.15-.6 1.74-.74V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm3 2h10v2H6V7zm0 4h10v2H6v-2zm12 3c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 7c-2.33 0-7 1.17-7 3.5V23h14v-1.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
        </span>
        <span class="nav-label">Pacientes</span>
      </a>

      <a routerLink="/doctors" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Médicos (Maletín médico) -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm6 11h-3v3h-2v-3H8v-2h3v-3h2v3h3v2z"/>
          </svg>
        </span>
        <span class="nav-label">Medicos</span>
      </a>

      <a routerLink="/studies" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Estudios (Tubo de ensayo + lupa) -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M7 2v2h1v14c0 2.21 1.79 4 4 4 .76 0 1.46-.22 2.06-.59l-1.48-1.48c-.18.04-.38.07-.58.07-1.1 0-2-.9-2-2v-5h3.1c.26-.73.68-1.39 1.21-1.93V4h1V2H7zm3 2h2v7h-2V4zm9.5 9c-1.93 0-3.5 1.57-3.5 3.5 0 .79.27 1.51.72 2.1l-2.43 2.43 1.41 1.41 2.43-2.43c.59.45 1.31.72 2.1.72 1.93 0 3.5-1.57 3.5-3.5S21.43 13 19.5 13zm0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </span>
        <span class="nav-label">Estudios</span>
      </a>

      <a routerLink="/users" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Usuarios -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-6 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 11H8v-1.5c0-2 4-3.1 6-3.1s6 1.1 6 3.1V16z"/>
          </svg>
        </span>
        <span class="nav-label">Usuarios</span>
      </a>

      <a routerLink="/settings" routerLinkActive="active-item" class="nav-item">
        <span class="nav-icon">
          <!-- Ícono Configuración -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </span>
        <span class="nav-label">Configuración</span>
      </a>
    </nav>
  </aside>

  <!-- Área de contenido dinámico donde cargará cada tabla (Entradas, Pacientes, etc.) -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
