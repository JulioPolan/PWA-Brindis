<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Contraseña</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/modal_style.css">
</head>
<body>

    <!-- Encabezado superior -->
    <header class="topbar">
        <a href="doctor_form.html" class="btn-logout">
            Volver <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </a>
    </header>

    <!-- Contenedor central -->
    <main class="main-container">
        <div class="card" style="max-width: 450px;">
            <div class="card-header">
                Editar Contraseña
            </div>
            
            <div class="card-body">
                <!-- Contraseña Vieja -->
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px; color: #333;">Contraseña Vieja</label>
                    <input type="password" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                </div>

                <!-- Contraseña Nueva -->
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px; color: #333;">Contraseña Nueva</label>
                    <input type="password" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                </div>

                <!-- Confirmar Contraseña Nueva -->
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px;">
                    <label style="font-weight: 600; font-size: 14px; color: #333;">Confirmar Contraseña Nueva</label>
                    <input type="password" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                </div>

                <!-- Botones de Acción Footer -->
                <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 20px;">
                    <button type="button" onclick="history.back()" style="background: linear-gradient(to bottom, #f0f0f0, #dcdcdc); border: 1px solid #ccc; color: #333; padding: 7px 20px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 13px;">Cancelar</button>
                    <button class="btn-nuevo" style="background: linear-gradient(to bottom, #41D5FF, #008FB8); color: white; border: none; padding: 7px 25px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 13px;">Guardar</button>
                </div>

                <div class="bottom-blank-space"></div>
            </div>
        </div>
    </main>

</body>
</html>
