<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar / Nuevo Paciente</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/modal_style.css">
</head>
<body>

    <!-- Encabezado superior -->
    <header class="topbar">
        <a href="patients.html" class="btn-logout">
            Volver <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </a>
    </header>

    <!-- Contenedor central -->
    <main class="main-container">
        <div class="card" style="max-width: 580px;">
            <div class="card-header">
                Editar Paciente
            </div>
            
            <div class="card-body">
                <!-- Fila Apellido Paterno y Materno -->
                <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Apellido Paterno</label>
                        <input type="text" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Apellido Materno</label>
                        <input type="text" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                    </div>
                </div>

                <!-- Campo Nombre -->
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
                    <label style="font-weight: 600; font-size: 14px; color: #333;">Nombre</label>
                    <input type="text" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                </div>

                <!-- Género y Fecha de Nacimiento -->
                <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Genero</label>
                        <select style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px; background: #fff;">
                            <option>--- Seleccionar ---</option>
                            <option>Masculino</option>
                            <option>Femenino</option>
                            <option>Sin Definir</option>
                        </select>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Fecha de Nacimiento</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="text" value="10/13/2026" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                            <i class="fa-regular fa-calendar" style="position: absolute; right: 12px; color: #666;"></i>
                        </div>
                    </div>
                </div>

                <!-- Sección: Información de Contacto -->
                <div style="font-size: 15px; font-weight: bold; color: #333; margin-bottom: 12px; border-top: 1px solid #eee; padding-top: 15px;">
                    Información de Contacto
                </div>

                <!-- Teléfono y Correo -->
                <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Teléfono Celular</label>
                        <input type="text" placeholder="ej. 123-4567" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #333;">Correo Electronico</label>
                        <input type="text" placeholder="ej. jose@correo.com" style="width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 18px; outline: none; font-size: 13px;">
                    </div>
                </div>

                <!-- Botones de Acción Footer -->
                <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 20px;">
                    <button type="button" onclick="history.back()" style="background: linear-gradient(to bottom, #f0f0f0, #dcdcdc); border: 1px solid #ccc; color: #333; padding: 7px 20px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 13px;">Cancelar</button>
                    <button class="btn-nuevo" style="background: linear-gradient(to bottom, #41D5FF, #008FB8); color: white; border: none; padding: 7px 25px; border-radius: 18px; font-weight: bold; cursor: pointer; font-size: 13px;">Guardar</button>
                </div>

                <div class="bottom-blank-space"></div>
            </div>
        </div>
    </main>

</body>
</html>
