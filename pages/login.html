<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExLABS - Iniciar Sesión</title>
    <link rel="stylesheet" href="../assets/styles/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Panel Izquierdo: Ilustración / Logo -->
        <div class="login-banner">
            <img src="../assets/img/logo.png" alt="Logo ExLABS" class="banner-img">
        </div>

        <!-- Panel Derecho: Formulario -->
        <div class="login-form-container">
            <h1 class="brand-title">ExLABS</h1>
            
            <form class="login-form" action="entries.html" method="GET">
                <div class="input-group">
                    <input type="text" placeholder="Usuario" required>
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
