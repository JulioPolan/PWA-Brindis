<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de Resultados</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/styles/modal_style.css">
</head>
<body>

    <!-- Encabezado superior -->
    <header class="topbar">
        <a href="#" class="btn-logout">
            Cerrar Sesión <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </a>
    </header>

    <!-- Contenedor central -->
    <main class="main-container">
        <div class="card">
            <div class="card-header">
                Bitácora de Resultados
            </div>
            
            <div class="card-body">
                <!-- Datos del Paciente -->
                <div class="patient-info">
                    <p><strong>Paciente:</strong> Cosme Fulanito</p>
                    <p><strong>Genero:</strong> Masculino</p>
                    <p><strong>Edad:</strong> 52 años</p>
                </div>

                <!-- Tabla de Resultados -->
                <table class="results-table">
                    <thead>
                        <tr>
                            <th class="col-doc">Nombre del documento</th>
                            <th class="col-date">Fecha de entrega</th>
                            <th style="width: 70px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="file-name-cell">
                                    <span class="file-icon-pdf">PDF</span>
                                    <span>Analisis_de_Sangre _Fulanito_Detal.pdf</span>
                                </div>
                            </td>
                            <td>2026-09-15 10:30:00</td>
                            <td class="actions-cell">
                                <button class="btn-icon btn-green" title="Descargar"><i class="fa-solid fa-download"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="file-name-cell">
                                    <span class="file-icon-3d">3D</span>
                                    <span>Tomografia_Torax_Corte.dcm</span>
                                </div>
                            </td>
                            <td>2026-02-27 13:00:00</td>
                            <td class="actions-cell">
                                <button class="btn-icon btn-orange" title="Ver"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button class="btn-icon btn-green" title="Descargar"><i class="fa-solid fa-download"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Espacio inferior dentro del panel -->
                <div class="bottom-blank-space"></div>
            </div>
        </div>
    </main>

</body>
</html>
